# Automated Release Pipeline for OpenCode Go KDE Plasmoid & CLI Utility

name: Release Pipeline

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate QML & JS Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate QML & JS Syntax
        run: |
          echo "Checking api.js syntax..."
          node --check contents/code/api.js
          echo "Checking QML brace balance..."
          FAIL=0
          for f in $(find contents/ui -name '*.qml'); do
            DEPTH=$(python3 -c "
import re, sys
src = open('$f').read()
d = 0
for line in src.split('\n'):
    s = re.sub(r'//.*', '', line)
    s = re.sub(r'\"(?:\\\\.|[^\"\\\\])*\"', '\"\"', s)
    d += s.count('{') - s.count('}')
print(d)
")
            if [ "$DEPTH" != "0" ]; then
              echo "FAIL: $f has unbalanced braces (depth=$DEPTH)"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "All QML files OK"

  build-and-release:
    name: Build & Package Plasmoid Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Release Version Environment Variable
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/heads/master" ]; then
            TAG="v2.2.0"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_ENV
          echo "Building release for version ${TAG}..."

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip imagemagick

      - name: Generate PNG Icons from Redesigned SVG Logo
        run: |
          echo "Generating PNG app icon sizes from assets/icon.svg..."
          mkdir -p contents/icons/
          cp assets/icon.svg contents/icons/com.mayanktaker.opencodego-usage.svg

      - name: Package .plasmoid Bundle Archive
        run: |
          PLASMOID_NAME="com.mayanktaker.opencodego-usage-${{ env.VERSION }}.plasmoid"
          zip -r "${PLASMOID_NAME}" metadata.json contents/ LICENSE README.md assets/
          echo "PLASMOID_FILE=${PLASMOID_NAME}" >> $GITHUB_ENV

      - name: Package Shareable Release ZIP Archive
        run: |
          ZIP_NAME="opencode-go-usage-${{ env.VERSION }}.zip"
          zip -r "${ZIP_NAME}" \
            "${{ env.PLASMOID_FILE }}" \
            install.sh \
            install-cli.sh \
            metadata.json \
            contents/ \
            bin/ \
            assets/ \
            README.md \
            LICENSE \
            -x "*.git*"
          echo "ZIP_FILE=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Release Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          files: |
            ${{ env.PLASMOID_FILE }}
            ${{ env.ZIP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
