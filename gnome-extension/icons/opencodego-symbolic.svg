<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- © Mayanktaker Computers & Web Development | https://mayanktaker.com -->
  <defs>
    <!-- Vibrant OpenCode Go Cyan/Teal Gradient -->
    <linearGradient id="opencodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Spark Highlight Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group holding redesigned OpenCode Go logo artwork matching mock design -->
  <g filter="url(#glow)">
    <!-- Left Angle Bracket '<' -->
    <path d="M 36 44 L 18 64 L 36 84" 
          fill="none" 
          stroke="url(#opencodeGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Angle Bracket '>' -->
    <path d="M 92 44 L 110 64 L 92 84" 
          fill="none" 
          stroke="url(#opencodeGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center Ring 'O' -->
    <circle cx="64" cy="65" r="19" 
            fill="none" 
            stroke="url(#opencodeGrad)" 
            stroke-width="10" 
            stroke-linecap="round"/>

    <!-- Top-Right Glowing Spark '✦' on Center Ring -->
    <path d="M 76 33 Q 76 41 84 41 Q 76 41 76 49 Q 76 41 68 41 Q 76 41 76 33 Z" 
          fill="url(#sparkGrad)"/>
  </g>
</svg>
